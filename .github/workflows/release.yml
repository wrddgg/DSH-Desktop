name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:ci
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          $assets = @(
            (Resolve-Path "release/DSH-Desktop-Setup-$version-x64.exe").Path
            (Resolve-Path "release/DSH-Desktop-Setup-$version-x64.exe.blockmap").Path
            (Resolve-Path "release/latest.yml").Path
          )
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "DSH Desktop $version" `
            --generate-notes `
            --verify-tag
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release upload failed with exit code $LASTEXITCODE"
          }
          $publishedAssets = @(
            gh release view $tag `
              --repo $env:GITHUB_REPOSITORY `
              --json assets `
              --jq '.assets[].name'
          )
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify the published release assets"
          }
          $expectedAssets = @($assets | ForEach-Object { Split-Path $_ -Leaf })
          $missingAssets = @($expectedAssets | Where-Object { $_ -notin $publishedAssets })
          if ($missingAssets.Count -gt 0) {
            throw "Release is missing assets: $($missingAssets -join ', ')"
          }
